services:
  db:
    image: pgvector/pgvector:pg16
    container_name: farmacos_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmacos_db}
      POSTGRES_USER: ${POSTGRES_USER:-farmacos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmacos_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmacos_user} -d ${POSTGRES_DB:-farmacos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend_fastapi/Dockerfile
    container_name: farmacos_backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-farmacos_user}:${POSTGRES_PASSWORD:-farmacos_password}@db:5432/${POSTGRES_DB:-farmacos_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
